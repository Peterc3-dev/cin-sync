[package]
name = "cin-sync"
version = "0.1.0"
edition = "2021"
description = "CIN distributed sync daemon — Tailscale-aware file sync + offload between GPD and thinkhub"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "7"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
walkdir = "2"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
